<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>公路小车</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#10131a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;max-width:520px;margin:auto;padding:10px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;padding:4px}.stats{display:flex;gap:7px}.badge{background:#202733;padding:7px 10px;border-radius:12px}.game{position:relative;flex:1;min-height:0;margin:8px 0;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #0009;touch-action:none}canvas{width:100%;height:100%;display:block}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}button{border:0;border-radius:15px;background:#27303d;color:#fff;font-size:28px;font-weight:800;padding:12px;touch-action:manipulation}.shoot{font-size:17px;background:#c84450}.new{margin-top:8px;font-size:15px;background:#fff;color:#111}.tip{text-align:center;font-size:12px;opacity:.5;padding:7px}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}.card{background:#202733;border-radius:24px;padding:28px;text-align:center;width:85%}.card button{background:#fff;color:#111;font-size:17px}</style></head><body><div class="app"><div class="top"><b>🚗 公路小车</b><div class="stats"><span class="badge">分数 <b id="score">0</b></span><span class="badge">💥 <b id="ammo">0</b></span></div></div><div class="game" id="game"><canvas id="c"></canvas></div><div class="controls"><button id="left">←</button><button id="right">→</button><button class="shoot" id="shoot">🔫 发射</button></div><button class="new" id="new">重新开始</button><div class="tip">左右移动躲避路障 · 吃 🍎 得3发子弹 · 子弹打掉路障</div></div><div class="overlay" id="over"><div class="card"><h2>💥 游戏结束</h2><p>最终分数：<b id="final">0</b></p><button id="again">再玩一次</button></div></div><script>
const box=document.getElementById('game'),c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,dpr,car,objs,shots,score,ammo,running,last,spawn,fruitSpawn,road=0,keys={};
function resize(){let r=box.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(car)car.y=H-85;draw()}
function reset(){score=0;ammo=0;objs=[];shots=[];spawn=0;fruitSpawn=0;road=0;running=true;car={x:W/2,y:H-85,w:40,h:66};document.getElementById('score').textContent=0;document.getElementById('ammo').textContent=0;document.getElementById('over').style.display='none';last=performance.now();requestAnimationFrame(loop)}
function lane(){return W*.28+Math.floor(Math.random()*3)*W*.22}
function add(type){objs.push({type,x:lane(),y:-35,w:type==='fruit'?32:44,h:type==='fruit'?32:48,v:150+Math.min(score*2,100)})}
function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.45&&Math.abs(a.y-b.y)<(a.h+b.h)*.45}
function shoot(){if(running&&ammo){ammo--;document.getElementById('ammo').textContent=ammo;shots.push({x:car.x,y:car.y-40,w:6,h:18})}}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.035);last=t;let dir=(keys.left?-1:0)+(keys.right?1:0);car.x+=dir*280*dt;car.x=Math.max(W*.18+20,Math.min(W*.82-20,car.x));spawn+=dt;fruitSpawn+=dt;if(spawn>.8){spawn=0;add('obstacle')}if(fruitSpawn>2.8){fruitSpawn=0;add('fruit')}road=(road+dt*190)%70;objs.forEach(o=>o.y+=o.v*dt);shots.forEach(s=>s.y-=500*dt);
for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(hit(car,o)){if(o.type==='fruit'){ammo+=3;score+=10;document.getElementById('ammo').textContent=ammo;document.getElementById('score').textContent=score;objs.splice(i,1)}else return end()}if(o.y>H+60)objs.splice(i,1)}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];if(s.y<-30){shots.splice(i,1);continue}for(let j=objs.length-1;j>=0;j--)if(objs[j].type==='obstacle'&&hit(s,objs[j])){objs.splice(j,1);shots.splice(i,1);score+=20;document.getElementById('score').textContent=score;break}}
draw();requestAnimationFrame(loop)}
function end(){running=false;document.getElementById('final').textContent=score;document.getElementById('over').style.display='flex'}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1d5b32';ctx.fillRect(0,0,W,H);ctx.fillStyle='#383a3d';ctx.fillRect(W*.14,0,W*.72,H);ctx.fillStyle='#eee';ctx.fillRect(W*.14,0,4,H);ctx.fillRect(W*.86-4,0,4,H);for(let y=-70+road;y<H;y+=70){ctx.fillRect(W*.38,y,4,38);ctx.fillRect(W*.62,y,4,38)}objs.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);if(o.type==='fruit'){ctx.font='29px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍎',0,0)}else{ctx.fillStyle='#f0a33b';round(-22,-24,44,48,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-22,-12,44,7);ctx.fillRect(-22,7,44,7)}ctx.restore()});shots.forEach(s=>{ctx.fillStyle='#ffe35c';round(s.x-3,s.y-9,6,18,3);ctx.fill()});ctx.save();ctx.translate(car.x,car.y);ctx.fillStyle='#e94555';round(-20,-33,40,66,9);ctx.fill();ctx.fillStyle='#bfe8ff';round(-14,-20,28,22,6);ctx.fill();ctx.fillStyle='#111';round(-25,-22,7,18,3);ctx.fill();round(18,-22,7,18,3);ctx.fill();round(-25,13,7,18,3);ctx.fill();round(18,13,7,18,3);ctx.fill();ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
['left','right'].forEach(id=>{let b=document.getElementById(id);b.onpointerdown=()=>keys[id]=true;b.onpointerup=()=>keys[id]=false;b.onpointercancel=()=>keys[id]=false;b.onpointerleave=()=>keys[id]=false});document.getElementById('shoot').onclick=shoot;document.getElementById('new').onclick=reset;document.getElementById('again').onclick=reset;window.onresize=resize;resize();reset();
</script></body></html>
